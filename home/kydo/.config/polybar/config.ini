[global/wm]
margin-top = 0
margin-bottom = 0

[settings]
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[bar/kydo]
monitor = eDP-1

bottom = false
fixed-center = true

width = 1800
height = 28

offset-x = 60
offset-y = 2

background = #000
foreground = #fff

radius = 5

line-size = 0
line-color = #f00

border-size = 0
border-color = #fff

padding = 0

font-0 = "Hack Nerd Font:style=Bold:size=8;2"

modules-left = bspwm 
modules-center = xwindow
modules-right = battery 

separator =

padding-left = 1
padding-right = 1

wm-restack = bspwm
override-redirect = false

[module/bspwm]
type = internal/bspwm

enable-click = false
enable-scroll = false
pin-workspaces = true

strip-ws-numbers = true

ws-icon-0 = 1;dev
ws-icon-1 = 2;www
ws-icon-2 = 3;game
ws-icon-3 = 4;chat
ws-icon-4 = 5;snd

format = <label-state> <label-mode>

label-focused = %icon%
label-focused-foreground = #ffffff
label-focused-background = #333333
label-focused-padding = 2
label-focused-margin = 0

label-occupied = %icon%
label-occupied-foreground = #ffffff
label-occupied-background = #252525
label-occupied-padding = 2
label-occupied-margin = 0

label-urgent = %icon%
label-urgent-foreground = #ffffff
label-urgent-background = #f0f0f0
label-urgent-padding = 2
label-urgent-margin = 0

label-empty = %icon%
label-empty-foreground = #ffffff
label-empty-background = #000000
label-empty-padding = 2
label-empty-margin = 0

[module/xwindow]
type = internal/xwindow

format = <label>
format-background = #00000000
format-foreground = #ffffff
format-padding = 4

label = %title%

label-empty = Empty

[module/battery]
type = internal/battery

full-at = 100
low-at = 0

battery = BAT0
adapter = ADP1

poll-interval = 5

time-format = %H:%M

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>

label-charging = Cha %percentage%%
label-discharging = Dis %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

bar-capacity-width = 10
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-framerate = 500

animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200

